<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t">
  <title id="t">mystical-assistant</title>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#cbb8ff"/>
      <stop offset="100%" stop-color="#a78bf0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#b9a6ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#b9a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="196" height="196" rx="46" fill="#060a0a" stroke="#7fe9d8" stroke-opacity=".22" stroke-width="2"/>

  <g transform="translate(100 100)" filter="url(#glow)">
    <circle r="52" fill="url(#halo)">
      <animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- outer ring: slow clockwise sweep -->
    <circle r="74" fill="none" stroke="#7fe9d8" stroke-width="5" stroke-dasharray="13 21" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- inner ring: faster, counter-clockwise -->
    <circle r="61" fill="none" stroke="#7fe9d8" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 14" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g transform="rotate(45)">
      <rect x="-40" y="-40" width="80" height="80" rx="4" fill="none" stroke="#7fe9d8" stroke-width="5">
        <animate attributeName="stroke-opacity" values="1;.62;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-18" y="-18" width="36" height="36" rx="3" fill="url(#core)">
        <animateTransform attributeName="transform" type="scale" values="1;1.14;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
