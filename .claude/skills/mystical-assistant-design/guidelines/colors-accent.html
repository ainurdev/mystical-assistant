<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; position: relative; }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: .35; z-index: 9;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,.22) 3px, transparent 4px); }
  .swrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 96px; height: 46px; border: 1px solid var(--border); }
  .nm { font-size: 9.5px; letter-spacing: .5px; color: var(--foreground); }
  .hx { font-family: var(--font-mono); font-size: 9px; color: var(--muted-foreground); }
  .cap { font-size: 9px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }

</style>
</head>
<body>
<div class="swrow">
  <div class="sw"><div class="chip" style="background:var(--primary)"></div><div class="nm">primary</div><div class="hx">#7fe9d8</div></div>
  <div class="sw"><div class="chip" style="background:var(--foreground-bright)"></div><div class="nm">fg-bright</div><div class="hx">#dff8f2</div></div>
  <div class="sw"><div class="chip" style="background:var(--ac-22)"></div><div class="nm">accent .22</div><div class="hx">rgb / .22</div></div>
  <div class="sw"><div class="chip" style="background:var(--ac-12)"></div><div class="nm">accent .12</div><div class="hx">rgb / .12</div></div>
  <div class="sw"><div class="chip" style="background:var(--ac-06)"></div><div class="nm">accent .06</div><div class="hx">rgb / .06</div></div>
  <div class="sw"><div class="chip" style="background:var(--ac-03)"></div><div class="nm">accent .03</div><div class="hx">rgb / .03</div></div>
</div>
<div class="scan"></div>
</body>
</html>
