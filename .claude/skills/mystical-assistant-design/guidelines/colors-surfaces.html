<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="The void and its translucent panels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; position: relative; }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: .35; z-index: 9;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,.22) 3px, transparent 4px); }
  .swrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 96px; height: 46px; border: 1px solid var(--border); }
  .nm { font-size: 9.5px; letter-spacing: .5px; color: var(--foreground); }
  .hx { font-family: var(--font-mono); font-size: 9px; color: var(--muted-foreground); }
  .cap { font-size: 9px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }
  
</style>
</head>
<body>
<div class="swrow">
  <div class="sw"><div class="chip" style="background:var(--background)"></div><div class="nm">background</div><div class="hx">#060a0a</div></div>
  <div class="sw"><div class="chip" style="background:var(--panel)"></div><div class="nm">panel</div><div class="hx">.5 teal-black</div></div>
  <div class="sw"><div class="chip" style="background:var(--card)"></div><div class="nm">card</div><div class="hx">.6 teal-black</div></div>
  <div class="sw"><div class="chip" style="background:var(--popover)"></div><div class="nm">popover</div><div class="hx">.97 opaque</div></div>
  <div class="sw"><div class="chip" style="border-color:var(--border)"></div><div class="nm">border</div><div class="hx">teal / .16</div></div>
  <div class="sw"><div class="chip" style="border-color:var(--border-bright);border-width:1px"></div><div class="nm">border-bright</div><div class="hx">teal / .4</div></div>
</div>
<div class="scan"></div>
</body>
</html>
