<!-- @dsCard group="Brand" viewport="700x200" name="The Oracle voice" subtitle="Lowercase, italic incantations · the ~ ❯ prompt · runes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; position: relative; }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: .35; z-index: 9;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,.22) 3px, transparent 4px); }
  .cap { font-size: 9px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:11px">
  <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono)">
    <span style="color:var(--violet)">~ ❯</span>
    <span style="color:var(--foreground-bright);font-size:13px">name the bug; i will unmake it.</span>
  </div>
  <div style="font-style:italic;color:var(--muted-foreground);font-size:12.5px;line-height:1.6;max-width:560px">
    “the bridge is open — speak your change.” &nbsp;·&nbsp; “every error is a door. show me yours.” &nbsp;·&nbsp; “the runes are listening.”
  </div>
  <div style="display:flex;gap:14px;font-size:18px;color:var(--primary);margin-top:2px">
    <span class="glow">✦</span><span class="glow">◈</span><span class="glow">⟁</span><span class="glow">☿</span><span class="glow">⌖</span><span class="glow">✧</span><span class="glow">◇</span><span class="glow">⬡</span><span class="glow">❖</span>
  </div>
  <div class="cap">UPPERCASE for instruments · lowercase italic for the oracle</div>
</div>
<div class="scan"></div>
</body>
</html>
