<!-- @dsCard group="Type" viewport="700x175" name="Tracking — the signature" subtitle="Nearly every uppercase label is letter-spaced" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; position: relative; }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: .35; z-index: 9;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,.22) 3px, transparent 4px); }
  .cap { font-size: 9px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }
  .row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:9px;color:var(--foreground)">
  <div style="font-size:11px;letter-spacing:10px;color:var(--foreground-bright)" class="glow">MYSTICAL//ASSISTANT</div>
  <div style="font-size:10px;letter-spacing:6px;color:var(--muted-foreground)">REMOTE DEV BRIDGE</div>
  <div style="font-size:10.5px;letter-spacing:2.5px;color:var(--primary)">PANEL · WORKSPACE</div>
  <div style="font-size:10px;letter-spacing:1.5px;color:var(--muted-foreground)">MOUNT · USED · REPO · CHANGES</div>
  <div style="font-size:9px;letter-spacing:1px;color:var(--muted-2)">OPUS · MAIN · ONLINE</div>
</div>
<div class="scan"></div>
</body>
</html>
