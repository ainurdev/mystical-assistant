<!-- @dsCard group="Colors" viewport="700x160" name="Named accents & surfaces" subtitle="Violet, blue, and the surface origin codes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; position: relative; }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: .35; z-index: 9;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,.22) 3px, transparent 4px); }
  .swrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 96px; height: 46px; border: 1px solid var(--border); }
  .nm { font-size: 9.5px; letter-spacing: .5px; color: var(--foreground); }
  .hx { font-family: var(--font-mono); font-size: 9px; color: var(--muted-foreground); }
  .cap { font-size: 9px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }

</style>
</head>
<body>
<div class="swrow">
  <div class="sw"><div class="chip" style="background:var(--violet)"></div><div class="nm">violet</div><div class="hx">#b9a6ff</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue)"></div><div class="nm">blue</div><div class="hx">#6fb5ff</div></div>
</div>
<div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap">
  <span style="font-size:9px;letter-spacing:1px;color:var(--surface-vs);border:1px solid var(--surface-vs);padding:3px 8px">VS</span>
  <span style="font-size:9px;letter-spacing:1px;color:var(--surface-web);border:1px solid var(--surface-web);padding:3px 8px">WEB</span>
  <span style="font-size:9px;letter-spacing:1px;color:var(--surface-tg);border:1px solid var(--surface-tg);padding:3px 8px">TG</span>
  <span style="font-size:9px;letter-spacing:1px;color:var(--surface-ma);border:1px solid var(--surface-ma);padding:3px 8px">MA</span>
  <span style="font-size:9px;letter-spacing:1px;color:var(--surface-cli);border:1px solid var(--surface-cli);padding:3px 8px">CLI</span>
</div>
<div class="scan"></div>
</body>
</html>
