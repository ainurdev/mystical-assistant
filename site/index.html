    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need an Anthropic API key?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It shells out to the claude CLI already on your machine and reuses the login you set up the first time you ran it. There's no key to paste anywhere, and no account to make here."
            }
          },
          {
            "@type": "Question",
            "name": "What does it install?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing to pip install — the server is Python 3.10+ standard library only. The dashboard UI is a Vite app that the bridge builds for you on first start, so you do need npm on the machine; after that it only rebuilds when the sources change."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work with the Claude Code I already run in VS Code?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "That's the main point of it. Sessions under your projects folder are read from Claude Code's own transcripts, and liveness comes from its session registry checked against the real process — so a VS Code or terminal session shows as running because it is, not because a file looked recent. Continue one and it's picked up from there on."
            }
          },
          {
            "@type": "Question",
            "name": "What actually happens when I hit a usage limit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The session gets parked rather than dropped. It reads the reset time from the usage endpoint, waits for it, then resumes the turn with its context intact. Server errors (500, 529, and the 429 that isn't a usage limit) take a separate path — the first retry is immediate and each repeat waits longer, out to thirty minutes. Both are persisted, so restarting the bridge mid-wait doesn't lose them."
            }
          },
          {
            "@type": "Question",
            "name": "How is the memory different from the memory plugins?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Two ways. Nothing is stored until you tap Keep on it, so the bank stays small and true instead of accumulating whatever a summariser thought was interesting. And facts are scoped to a project and a branch, so assumptions from a spike don't follow you back to main."
            }
          },
          {
            "@type": "Question",
            "name": "Where does my code actually go?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It stays on your machine, and there's no telemetry — the dashboard talks only to localhost, and nothing is sent anywhere the claude CLI wasn't already sending it. One caveat worth stating: the memory, teacher, auto-title and new-session checks each run their own cheap Haiku pass through your CLI after a turn, so they do send that turn's output to Anthropic in a second call. MEMORY_ENABLE=0, LEARNING_ENABLE=0, TITLE_ENABLE=0 and RELEVANCE_CHECK=0 turn them off individually."
            }
          },
          {
            "@type": "Question",
            "name": "Is the dashboard exposed to the internet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It binds 127.0.0.1 and is never published. A Host allow-list guards against DNS rebinding and a token guards against CSRF."
            }
          },
          {
            "@type": "Question",
            "name": "Can I drive it from my phone without Telegram?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not yet. Remote control today goes through Telegram — the bot for quick prompts, the Mini App for the full panel — because the dashboard deliberately never leaves localhost. A signed-in web surface you can reach from anywhere is the plan; until it lands, off-machine access means Telegram, and on-machine means the dashboard."
            }
          },
          {
            "@type": "Question",
            "name": "What does it cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing to buy — it's free and MIT licensed, and it drives the Claude Code you already pay for. Fair warning on your quota rather than your wallet: the memory, teacher, auto-title and relevance passes are extra Haiku calls on your plan, small but not free. Each is one env var away from off, and your live 5-hour and 7-day usage sits on screen so you can watch it."
            }
          },
          {
            "@type": "Question",
            "name": "Which operating systems work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "macOS and Linux, including WSL."
            }
          },
          {
            "@type": "Question",
            "name": "Can I turn off the memory and teacher features?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — MEMORY_ENABLE=0 and LEARNING_ENABLE=0 in your .env. Both run as a cheap Haiku pass after a turn, and both propose rather than decide: nothing is kept until you tap Keep."
            }
          },
          {
            "@type": "Question",
            "name": "Setup asks for a Telegram bot token. Why?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The project began as a Telegram bridge and setup still requires that token, even though the dashboard doesn't use it. Making it optional for a dashboard-only install is the next thing on the list. Until then, creating a throwaway bot takes about a minute and nothing will message it."
            }
          }
        ]
