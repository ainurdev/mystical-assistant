    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need an Anthropic API key?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It shells out to the claude CLI already on your machine and reuses the login you set up the first time you ran it. There's no key to paste anywhere, and no account to make here."
            }
          },
          {
            "@type": "Question",
            "name": "What does it install?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing to pip install: the server is Python 3.10+ standard library only. The dashboard UI is a Vite app the bridge builds on first start, so you do need npm on the machine; after that it rebuilds only when the sources change."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work with the Claude Code I already run in VS Code?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "That's the main point of it. Sessions under your projects folder are read from Claude Code's own transcripts, and liveness comes from its session registry checked against the real process. A VS Code or terminal session shows as running because it is, not because a file looked recent. Continue one and it carries on from there."
            }
          },
          {
            "@type": "Question",
            "name": "What actually happens when I hit a usage limit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The session gets parked rather than dropped, then it looks for a way to keep going: another Claude account of yours with quota left, a free agent on a different provider, or failing both, the reset itself. It reads the reset time from the usage endpoint, waits, and resumes the turn with its context intact. You set whether it asks first, switches on its own, or only ever waits, per session or as the default. Server errors (500, 529, and the 429 that isn't a usage limit) take a separate path: the first retry is immediate and each repeat waits longer, out to thirty minutes. All of it is persisted, so restarting the bridge mid-wait doesn't lose it."
            }
          },
          {
            "@type": "Question",
            "name": "Can it use a second Claude account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, if you have one. Add it from the dashboard's Accounts tab: a sign-in link opens, you log in as that account, you paste the code back. Each account lives in its own profile directory, so the login you already had is never touched, and every turn is still the real claude binary spawned per run with that profile. Nothing proxies or pools tokens. When a limit hits, the account with the most quota left goes first, and its meter sits next to the others in that tab."
            }
          },
          {
            "@type": "Question",
            "name": "Where does my code actually go?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It stays on your machine, and there's no telemetry: the dashboard talks only to localhost, and nothing is sent anywhere the claude CLI wasn't already sending it. One caveat: the auto-title and new-session checks each run a cheap Haiku pass through your CLI after a turn, so they do send that turn's output to Anthropic in a second call. TITLE_ENABLE=0 and RELEVANCE_CHECK=0 turn them off individually."
            }
          },
          {
            "@type": "Question",
            "name": "Can I drive it from my phone without Telegram?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not yet. Remote control today goes through Telegram: the bot for quick prompts, the Mini App for the full panel. The dashboard never leaves localhost by design. A signed-in web surface you can reach from anywhere is the plan; until it lands, off-machine access means Telegram."
            }
          },
          {
            "@type": "Question",
            "name": "What does it cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing to buy. It's MIT licensed and it drives the Claude Code you already pay for. What it costs lands on your quota rather than your wallet, and your live 5-hour and 7-day usage sits on screen so you can watch it."
            }
          },
          {
            "@type": "Question",
            "name": "Which operating systems work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "macOS and Linux, including WSL."
            }
          },
          {
            "@type": "Question",
            "name": "Setup asks for a Telegram bot token. Why?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The project began as a Telegram bridge and setup still requires that token, even though the dashboard doesn't use it. Making it optional for a dashboard-only install is the next thing on the list. Until then, creating a throwaway bot takes about a minute and nothing will message it."
            }
          }
        ]
      }
